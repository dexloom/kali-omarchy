# kitty — kali-hyprland
#
# CTRL+C, CTRL+V and CTRL+Z are left to the terminal. Copy, paste and undo live
# on SUPER instead — see the CLIPBOARD section of config/hypr/omarchy4.lua.
#
# This file used to do the opposite. It mapped
#
#   map ctrl+c  copy_or_interrupt
#   map ctrl+v  paste_from_clipboard
#
# to get GUI-style copy/paste in the terminal, leaning on kitty's
# copy_or_interrupt (copy when there is a selection, SIGINT when there is not).
# It worked, but only in kitty, and only by making one key mean two things
# depending on invisible state — which is a poor trade for the one key you most
# need to be certain about. SUPER+C / SUPER+V / SUPER+Z do the GUI job now, in
# every application, and CTRL+C is SIGINT again with nothing qualifying it.
#
# SUPER+C and SUPER+V forward CTRL+SHIFT+C / CTRL+SHIFT+V to a focused terminal,
# so the two maps below are what those bindings land on. They are also kitty's
# own defaults; they are written out because the compositor binding depends on
# them and a default that moves would break it silently.
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

scrollback_lines           10000
enable_audio_bell          no
confirm_os_window_close    0
