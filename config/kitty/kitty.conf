# kitty — kali-hyprland
#
# The point of this file: make Ctrl+C / Ctrl+V behave the way they do in every
# GUI app, WITHOUT losing SIGINT.
#
# On Wayland there is no global key grabber, and binding CTRL+C in the
# compositor would fire first and take SIGINT away from every terminal. kitty
# solves it properly at the terminal level:
#
#   copy_or_interrupt — copy when there IS a selection, send SIGINT when there
#                       is not. That is the behaviour people actually want.
#
# qterminal has no equivalent smart mode: its Copy shortcut is either Ctrl+C or
# Ctrl+Shift+C, so making it Ctrl+C would cost you SIGINT outright. It is left
# on the Ctrl+Shift defaults deliberately. Use kitty (SUPER+K) when you want
# the GUI-style bindings.

map ctrl+c  copy_or_interrupt
map ctrl+v  paste_from_clipboard

# Keep the conventional terminal bindings working too.
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# Ctrl+Z is job control (suspend) and stays that way — a terminal has no
# "undo", so remapping it would only break bg/fg workflows.

scrollback_lines           10000
enable_audio_bell          no
confirm_os_window_close    0
