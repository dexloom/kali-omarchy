# kali-hyprland: keep the GTK portal from racing the session environment.
#
# Under uwsm the portal units can start before WAYLAND_DISPLAY/DISPLAY have been
# imported into the systemd user manager. The backend then dies with a bare
#   cannot open display:
# and the core xdg-desktop-portal times out waiting for it:
#   Failed to create settings proxy: ... Timeout was reached
#   Not providing Settings portal: No working backend
# leaving file pickers and screen sharing broken for the whole session.
#
# Ordering after graphical-session.target means the env is populated first, and
# the restart policy self-heals the case where it still loses the race.
[Unit]
After=graphical-session.target
PartOf=graphical-session.target

[Service]
Restart=on-failure
RestartSec=2
