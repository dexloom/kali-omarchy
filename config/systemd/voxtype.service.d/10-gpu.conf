# kali-hyprland: pin voxtype's Vulkan backend to the discrete GPU.
#
# ggml_vulkan enumerates two devices on this laptop:
#   0 = Intel Iris Plus (Mesa)   uma:1  fp16:1
#   1 = NVIDIA GeForce MX350     uma:0  fp16:0   <- SELECTED
#
# MEASURED, same 31.9s file, model=small, three runs each:
#   NVIDIA MX350     3.8 / 3.8 / 3.7 s     (~8.4x realtime)
#   Intel Iris Plus  9.5 / 11.9 / 9.5 s
# The MX350 wins by ~2.6x despite reporting fp16:0 — its core count more than
# makes up for the 1/64-rate fp16 on Pascal. Do not assume otherwise from the
# capability flags; measure.
#
# THE CATCH — 2048 MiB of VRAM is a hard ceiling:
#   small          466 MB   fits, lots of headroom       <- use this
#   large-v3-turbo 1.6 GB   OOMs. Measured:
#       ggml_vulkan: Device memory allocation of size 31457280 failed
#       whisper_kv_cache_init: failed to allocate memory for the kv cache
#       ERROR Transcription failed: Failed to create a new whisper context
#   Recording still worked, so this failed silently until the log was read.
#
# If you want large-v3-turbo's accuracy, it only runs on the Intel device
# (uma:1, allocates from system RAM) and takes 20.7s on the same file:
#   Environment=GGML_VK_VISIBLE_DEVICES=0
#   voxtype config set whisper.model large-v3-turbo
#
# NOTE: voxtype's own VOXTYPE_VULKAN_DEVICE is NOT honoured by the whisper
# path — set to "nvidia" it still logged gpu_device = 0. Only
# GGML_VK_VISIBLE_DEVICES actually moves the work.
[Service]
Environment=GGML_VK_VISIBLE_DEVICES=1
